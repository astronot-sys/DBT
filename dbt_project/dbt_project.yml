model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  demo:
    staging:
      +materialized: table
      +schema: staging
    export:
      +materialized: table
      +schema: export
    marts:
      +materialized: table
      +schema: marts