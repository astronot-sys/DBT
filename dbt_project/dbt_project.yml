name: demo
version: "1.0.0"
config-version: 2
profile: demo

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  demo:
    # Staging is a table (not a view) so the loader can safely drop and
    # recreate the raw tables on every run.
    staging:
      +materialized: table
      +schema: staging
    export:
      +materialized: table
      +schema: export
